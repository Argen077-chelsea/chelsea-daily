.a{position:absolute;white-space:nowrap}

.panel{background:rgba(2,26,69,.78);border:4px solid rgba(255,255,255,.25);border-radius:32px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.4}
.row{height:140px;border-radius:26px;display:flex;align-items:center;padding:0 44px;box-sizing:border-box;font-size:58px;font-weight:800;line-height:1.4;background:rgba(255,255,255,.16)}
.row.hl{background:#f2b705;color:#0b1a3a}.row .r{width:90px}.row .st{margin-left:auto;font-size:44px;font-weight:500}
.big{font-weight:800;line-height:1.2;color:#f2b705}

</style></head><body>
<div id="root" data-composition-id="long3" data-start="0" data-width="1920" data-height="1080" data-duration="26.85" data-at="69.69">
<div id="bgs" data-deco><div class="stripe" style="top:160px"></div><div class="stripe" style="top:760px"></div></div>
<div class="sc" id="o1"><div class="a tag" data-d="0"><span>ยังไม่พร้อมลงสนาม</span></div><div class="a row" style="left:160px;top:250px;width:1600px;" data-d="1.0"><span>ชูเอา เปโดร</span><span class="st">ต้นขา · ยังไม่ซ้อมกับทีม</span></div><div class="a row" style="left:160px;top:430px;width:1600px;" data-d="4.48"><span>มักซ็องซ์ ลาครัวซ์</span><span class="st">แฮมสตริง</span></div><div class="a pill" style="top:650px" data-d="8.21"><span>ลาครัวซ์ ลุ้นกลับก่อนสิ้นปี 2026</span></div><div class="a c p" style="top:790px" data-d="9.61" >มีลุ้นมากกว่า รีซ เจมส์</div></div>
<div class="sc" id="o2"><div class="a tag" data-d="0"><span>ต้องพักอีกหลายสัปดาห์</span></div><div class="a row" style="left:160px;top:300px;width:1600px;" data-d="0.6"><span>ยอร์เรล ฮาโต</span><span class="st">หลัง</span></div><div class="a row" style="left:160px;top:500px;width:1600px;" data-d="2.2"><span>รีซ เจมส์</span><span class="st">เข่า</span></div><div class="a c h2 g" style="top:760px" data-d="3.6" >พักอีกหลายสัปดาห์</div></div>
<div class="sc" id="o3"><div class="a tag" data-d="0"><span>ใกล้กลับมา</span></div><div class="a c h1 g" style="top:240px;font-size:150px" data-d="0.3" >เจมี กิตเทนส์</div><div class="a c h2" style="top:440px" data-d="1.2" >กลับมาซ้อมกับทีมแล้ว</div><div class="a c p" style="top:620px" data-d="3.6" >อลอนโซขอให้เวลาฟื้นตัวก่อนใส่ชื่อ</div></div>
</div><script>
const SCENES=[{"k": "o1", "t0": 0.0, "t1": 13.09, "last": false}, {"k": "o2", "t0": 13.09, "t1": 19.91, "last": false}, {"k": "o3", "t0": 19.91, "t1": 26.85, "last": true}];const DUR=26.85;const ID="long3";

const $=s=>document.querySelector(s);
const tl=gsap.timeline({paused:true});
SCENES.forEach((S,i)=>{
  const el=document.getElementById(S.k); gsap.set(el,{autoAlpha:0});
  tl.set(el,{autoAlpha:1},S.t0);
  el.querySelectorAll('[data-d]').forEach(x=>{
    tl.from(x,{opacity:0,y:50,scale:.94,duration:.55,ease:'expo.out'},S.t0+parseFloat(x.dataset.d));
  });
  el.querySelectorAll('[data-count]').forEach(x=>{
    const [f,t,d,pre,suf,at]=x.dataset.count.split('|'); const o={v:+f}; x.textContent=pre+Math.round(+f).toLocaleString('en-US')+suf;
    tl.to(o,{v:+t,duration:+d,ease:'power2.out',onUpdate:()=>{x.textContent=pre+Math.round(o.v).toLocaleString('en-US')+suf}},S.t0+parseFloat(at));
  });
  el.querySelectorAll('[data-sw]').forEach(x=>{
    const [nt,d]=x.dataset.sw.split('|'); const old=x.textContent; const o={v:0};
    tl.to(o,{v:1,duration:.01,onUpdate:()=>{x.textContent=o.v>=.5?nt:old}},S.t0+parseFloat(d));
    tl.fromTo(x,{scale:1},{scale:1.35,duration:.18,yoyo:true,repeat:1,ease:'expo.out'},S.t0+parseFloat(d));
  });
  el.querySelectorAll('[data-swap]').forEach(x=>{
    const [dy,d]=x.dataset.swap.split('|'); gsap.set(x,{y:+dy});
    tl.to(x,{y:0,duration:.7,ease:'power2.inOut'},S.t0+parseFloat(d));
  });
  el.querySelectorAll('[data-pulse]').forEach(x=>{
    const [d,n]=x.dataset.pulse.split('|');
    tl.to(x,{scale:1.06,duration:.45,ease:'power2.inOut',yoyo:true,repeat:+n},S.t0+parseFloat(d));
  });
  el.querySelectorAll('.fl').forEach(x=>{tl.to(x,{y:'-=14',duration:Math.max(1,S.t1-S.t0-.8),ease:'none'},S.t0+.6)});
  if(!S.last){tl.to(el,{autoAlpha:0,y:-50,duration:.25,ease:'expo.in'},S.t1-.25); tl.set(el,{y:0},S.t1+.01)}
});
tl.fromTo('#bgs',{x:-60},{x:60,duration:DUR,ease:'none'},0);
tl.set({},{},DUR);
window.__timelines[ID]=tl;
</script></body></html>
