<!doctype html>
<html lang="th"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;800&display=block" rel="stylesheet" />
<script src="cards/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #021a45; }
  #root { position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 35%, #0a4aa8 0%, #034694 35%, #021a45 85%); font-family: "Prompt", sans-serif; color: #fff; }
  .wm { position: absolute; left: -40px; right: -40px; top: 760px; text-align: center; font-size: 330px; font-weight: 800; line-height: 1.3; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.16); letter-spacing: 6px; white-space: nowrap; }
  .stripe { position: absolute; left: -200px; width: 1500px; height: 120px; background: rgba(255,255,255,.05); transform: rotate(-12deg); }
  .abs { position: absolute; left: 0; right: 0; text-align: center; }
  .pill { top: 330px; }
  .pill span { display: inline-block; background: #f2b705; color: #0b1a3a; font-weight: 800; font-size: 64px; line-height: 1.4; padding: 14px 54px; border-radius: 70px; }
  .name { top: 560px; font-size: 260px; font-weight: 800; line-height: 1.4; padding: 10px 0; }
  .l1 { top: 880px; white-space: nowrap; font-size: 130px; font-weight: 800; line-height: 1.4; color: #f2b705; padding: 10px 40px; }
  .l2 { top: 880px; white-space: nowrap; font-size: 118px; font-weight: 800; line-height: 1.4; padding: 10px 40px; }
  .l2 em { font-style: normal; color: #f2b705; }
  .sub { top: 1330px; font-size: 54px; font-weight: 500; line-height: 1.5; opacity: .85; }
  .ticker { position: absolute; left: 0; right: 0; top: 1500px; height: 90px; background: #f2b705; }
  .ticker div { position: absolute; top: 0; left: 0; white-space: nowrap; font-size: 46px; font-weight: 800; color: #0b1a3a; line-height: 90px; }
</style></head>
<body>
<div id="root" data-composition-id="hook" data-start="0" data-width="1080" data-height="1920" data-duration="8.2" data-at="0">
  <div class="stripe" style="top:300px" data-deco></div>
  <div class="stripe" style="top:1100px" data-deco></div>
  <div class="wm" id="wm" data-deco>CHELSEA</div>
  <div class="abs pill" id="pill"><span>ข่าวด่วน</span></div>
  <div class="abs name" id="name">เชลซี</div>
  <div class="abs l1" id="l1">ทีมหญิง<br>แซงจ่าฝูง!</div>
  <div class="abs l2" id="l2">อนาคต <em>กุสโต</em><br>สั่นคลอน?</div>
  <div class="abs sub" id="sub" data-legal>15 พ.ย. 2026</div>
  <div class="ticker" id="tk"><div id="tkt" data-deco>CHELSEA NEWS • ข่าวเชลซีวันนี้ • CHELSEA NEWS • ข่าวเชลซีวันนี้ • CHELSEA NEWS • ข่าวเชลซีวันนี้ • CHELSEA NEWS • ข่าวเชลซีวันนี้ • CHELSEA NEWS</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const tl = gsap.timeline({ paused: true });
gsap.set([$("name"), $("l1"), $("l2"), $("sub")], { opacity: 0 });
// เฟรมแรกมีของ: ป้ายข่าวด่วนอยู่ในเฟรมแล้ว (ใหญ่แล้วหดลง)
tl.fromTo($("pill"), { scale: 1.7, opacity: 0.7 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0);
tl.fromTo($("name"), { opacity: 0, scale: 1.5, filter: "blur(24px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.25);
tl.fromTo($("wm"), { x: 40 }, { x: -40, duration: 8.2, ease: "none" }, 0);
tl.fromTo($("tkt"), { x: 0 }, { x: -1900, duration: 8.2, ease: "none" }, 0);
// ประเด็น 1
tl.fromTo($("l1"), { opacity: 0, y: 70, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 2.16);
tl.to($("name"), { y: -10, duration: 7.2, ease: "none" }, 0.7);
tl.to([$("l1"), $("pill")], { opacity: 0, y: -50, duration: 0.25, ease: "expo.in" }, 3.9);
// ประเด็น 2
tl.fromTo($("l2"), { opacity: 0, y: 70, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 4.2);
tl.fromTo($("sub"), { opacity: 0, y: 30 }, { opacity: 0.85, y: 0, duration: 0.5, ease: "expo.out" }, 5.9);
tl.to([$("l2"), $("sub"), $("name")], { opacity: 0, y: "-=40", duration: 0.3, ease: "expo.in", stagger: 0.04 }, 7.85);
tl.set({}, {}, 8.2);
window.__timelines["hook"] = tl;
</script></body></html>
