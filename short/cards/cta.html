<!doctype html>
<html lang="th"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;800&display=block" rel="stylesheet" />
<script src="cards/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #021a45; }
  #root { position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 35%, #0a4aa8 0%, #034694 35%, #021a45 85%); font-family: "Prompt", sans-serif; color: #fff; }
  .sc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  .tag { top: 300px; } .tag span { display: inline-block; background: #f2b705; color: #0b1a3a; font-weight: 800; font-size: 52px; line-height: 1.4; padding: 10px 44px; border-radius: 60px; }
  .big { font-size: 170px; font-weight: 800; line-height: 1.4; padding: 10px 0; }
  .mid { font-size: 96px; font-weight: 800; line-height: 1.4; padding: 6px 0; }
  .small { font-size: 62px; font-weight: 500; line-height: 1.5; opacity: .85; }
  .gold { color: #f2b705; }
  .btn { position: absolute; width: 400px; height: 260px; border-radius: 36px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 74px; font-weight: 800; line-height: 1.4; }
  .step { position: absolute; left: 140px; right: 140px; height: 170px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: 800; line-height: 1.4; background: rgba(255,255,255,.16); }
  .arrow { position: absolute; left: 0; right: 0; text-align: center; font-size: 80px; color: #f2b705; line-height: 1.2; }
  .cta { position: absolute; left: 90px; right: 90px; top: 700px; height: 260px; border-radius: 130px; background: #f2b705; color: #0b1a3a; display: flex; align-items: center; justify-content: center; font-size: 130px; font-weight: 800; line-height: 1.4; }
</style></head>
<body>
<div id="root" data-composition-id="cta" data-start="0" data-width="1080" data-height="1920" data-duration="18.8" data-at="41.2">

  <!-- A 0–5 : คำถาม -->
  <div class="sc" id="A">
    <div class="abs tag a"><span>ความเห็นแฟนๆ</span></div>
    <div class="abs mid a" style="top:540px">ควรเก็บหรือปล่อย</div>
    <div class="abs big gold a" style="top:700px; font-size:200px">กุสโต?</div>
    <div class="btn" id="bA" style="left:90px; top:1050px; background:#f2b705; color:#0b1a3a">เก็บไว้</div>
    <div class="btn" id="bB" style="right:90px; top:1050px; background:rgba(255,255,255,.18)">ปล่อยไป</div>
  </div>

  <!-- B 5–10 : มุมมอง -->
  <div class="sc" id="B">
    <div class="abs tag b"><span>ส่วนตัวผมมองว่า</span></div>
    <div class="step" id="s1" style="top:600px">ไม่ได้ลงเล่นต่อเนื่อง</div>
    <div class="arrow" id="ar1" style="top:790px">▼</div>
    <div class="step" id="s2" style="top:900px; background:#f2b705; color:#0b1a3a">ปล่อยยืม / ขายทำกำไร</div>
    <div class="arrow" id="ar2" style="top:1090px">▼</div>
    <div class="step" id="s3" style="top:1200px">ตลาดเดือนมกราคม</div>
  </div>

  <!-- C 10–15 : CTA (ค้างถึงจบ) -->
  <div class="sc" id="C">
    <div class="abs mid c" style="top:480px">แฟนสิงห์บลูส์คิดยังไง?</div>
    <div class="cta" id="cta">คอมเมนต์เลย!</div>
    <div class="abs mid c gold" style="top:1060px">พรุ่งนี้ 9 โมงเช้า</div>
    <div class="abs small c" style="top:1230px">กดติดตาม ไม่พลาดข่าวเชลซีทุกเช้า</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const tl = gsap.timeline({ paused: true });
const DUR = 18.8;
const SC = { B: [0, 7.5], A: [7.5, 11.3], C: [11.3, 18.8] };
for (const k in SC) {
  const [a, b] = SC[k], el = $(k);
  gsap.set(el, { autoAlpha: 0 });
  tl.set(el, { autoAlpha: 1 }, a);
  const kids = el.querySelectorAll("." + k.toLowerCase());
  if (kids.length) tl.from(kids, { y: 90, opacity: 0, scale: 0.92, duration: 0.55, ease: "expo.out", stagger: 0.12 }, a + 0.02);
  if (b < DUR) tl.to(el, { autoAlpha: 0, y: -60, duration: 0.25, ease: "expo.in" }, b - 0.25);
  tl.set(el, { y: 0 }, b + 0.01);
}
// A: ปุ่มโหวตเด้งเข้า
gsap.set(["#bA", "#bB"], { opacity: 0, scale: 0.6 });
tl.to("#bA", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 8.0);
tl.to("#bB", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 8.4);
tl.to("#bA", { scale: 1.06, duration: 0.5, ease: "power2.inOut", yoyo: true, repeat: 3 }, 8.9);
tl.to("#A .big", { y: -14, duration: 3.2, ease: "none" }, 8.0);
// B: ไล่ทีละขั้น
gsap.set(["#s1", "#s2", "#s3"], { opacity: 0, x: -140 }); gsap.set(["#ar1", "#ar2"], { opacity: 0, y: -20 });
tl.to("#s1", { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 1.55);
tl.to("#ar1", { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 2.5);
tl.to("#s2", { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 3.1);
tl.to("#ar2", { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 4.9);
tl.to("#s3", { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 5.4);
// C: ปุ่ม CTA เด้ง แล้วเต้นเบาๆ ค้างถึงจบ (≥ 3 วิ)
gsap.set("#cta", { opacity: 0, scale: 0.5 });
tl.to("#cta", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 11.7);
tl.to("#cta", { scale: 1.05, duration: 0.45, ease: "power2.inOut", yoyo: true, repeat: 15 }, 12.5);
tl.set({}, {}, 18.8);
window.__timelines["cta"] = tl;
</script></body></html>
